<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servo Calibration - Quadruped Robot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ── Calibration page overrides ─────────────────────── */
        body { overflow-y: auto; }
        
        .page-nav {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .page-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.35rem 1rem;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: var(--transition-smooth);
        }
        .page-nav a:hover {
            color: var(--accent-cyan);
            border-color: rgba(0, 245, 212, 0.25);
            background: rgba(0, 245, 212, 0.05);
        }
        .page-nav a.active {
            color: var(--accent-cyan);
            border-color: rgba(0, 245, 212, 0.3);
            background: rgba(0, 245, 212, 0.08);
        }

        .calibration-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        /* Servo grid */
        .servo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .servo-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 1rem;
            transition: var(--transition-smooth);
        }
        .servo-card:hover {
            border-color: rgba(0, 187, 249, 0.3);
        }
        .servo-card.selected {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.15);
        }

        .servo-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .servo-card-header h3 {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .servo-idx {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.05);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }
        .servo-channel {
            font-size: 0.7rem;
            color: var(--accent-blue);
        }

        /* Angle slider per card */
        .servo-angle-control {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .servo-angle-control input[type="range"] {
            flex: 1;
        }
        .servo-angle-val {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-cyan);
            min-width: 48px;
            text-align: right;
        }

        /* Leg group labels */
        .leg-group-label {
            grid-column: 1 / -1;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-left: 3px solid var(--accent-blue);
            padding-left: 0.75rem;
            margin-top: 0.5rem;
        }
        .leg-group-label.front { border-color: var(--accent-cyan); }
        .leg-group-label.hind { border-color: var(--accent-orange); }

        /* Quick action buttons */
        .servo-card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .btn-sm {
            font-size: 0.72rem;
            padding: 0.3rem 0.6rem;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            border-radius: 5px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .btn-sm:hover {
            color: var(--accent-cyan);
            border-color: rgba(0, 245, 212, 0.3);
            background: rgba(0, 245, 212, 0.08);
        }

        /* Right column detail panel */
        .detail-panel {
            position: sticky;
            top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .detail-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 1.25rem;
        }
        .detail-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            border-left: 2px solid var(--accent-blue);
            padding-left: 0.5rem;
        }

        .detail-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .detail-field label {
            font-size: 0.82rem;
            color: var(--text-primary);
        }
        .detail-field input[type="number"] {
            width: 80px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            padding: 0.35rem 0.5rem;
            border-radius: 5px;
            font-size: 0.85rem;
            font-family: var(--font-main);
            text-align: right;
            outline: none;
        }
        .detail-field input[type="number"]:focus {
            border-color: var(--accent-blue);
        }

        /* Toggle switch */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: rgba(255,255,255,0.1);
            border-radius: 24px;
            transition: 0.3s;
        }
        .toggle-slider::before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: rgba(0, 245, 212, 0.3);
        }
        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(20px);
            background-color: var(--accent-cyan);
        }

        /* Global action buttons */
        .global-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .btn-action {
            padding: 0.55rem 1rem;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.03);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-action:hover {
            border-color: rgba(0, 187, 249, 0.4);
            background: rgba(0, 187, 249, 0.08);
            color: var(--accent-blue);
        }
        .btn-action.primary {
            border-color: rgba(0, 245, 212, 0.35);
            background: rgba(0, 245, 212, 0.08);
            color: var(--accent-cyan);
        }
        .btn-action.primary:hover {
            background: rgba(0, 245, 212, 0.15);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
        }
        .btn-action.danger {
            border-color: rgba(255, 56, 56, 0.3);
            color: var(--accent-red);
        }
        .btn-action.danger:hover {
            background: rgba(255, 56, 56, 0.1);
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.75rem 1.5rem;
            background: rgba(0, 245, 212, 0.12);
            border: 1px solid rgba(0, 245, 212, 0.3);
            color: var(--accent-cyan);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.error {
            background: rgba(255, 56, 56, 0.12);
            border-color: rgba(255, 56, 56, 0.3);
            color: var(--accent-red);
        }

        /* Servo visual map */
        .robot-map {
            display: grid;
            grid-template-columns: 1fr 60px 1fr;
            grid-template-rows: auto auto;
            gap: 0.5rem;
            align-items: center;
            justify-items: center;
            padding: 1rem 0;
        }
        .robot-map .body-icon {
            grid-column: 2;
            grid-row: 1 / 3;
            width: 40px;
            height: 80px;
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: var(--accent-blue);
        }
        .map-leg {
            font-size: 0.72rem;
            padding: 0.4rem 0.6rem;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: center;
            min-width: 60px;
        }
        .map-leg:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        @media (max-width: 900px) {
            .calibration-layout {
                grid-template-columns: 1fr;
                margin-top: 1rem;
            }
            .servo-grid {
                grid-template-columns: 1fr;
            }
            .detail-panel {
                position: static;
            }
        }

        @media (max-width: 600px) {
            .page-nav {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 0.25rem;
            }
            .servo-card-actions {
                flex-wrap: wrap;
            }
            .btn-sm {
                flex: 1;
                text-align: center;
                padding: 0.4rem 0.5rem;
            }
            .toast {
                left: 1rem;
                right: 1rem;
                bottom: 1rem;
                text-align: center;
            }
            .actions-card .btn-action {
                padding: 0.65rem 0.75rem;
                font-size: 0.82rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container" style="height: auto; min-height: 100vh;">
        <!-- HEADER -->
        <header class="main-header">
            <div class="brand">
                <div class="logo-circle"></div>
                <h1>ANTIGRAVITY <span>QUADRUPED</span></h1>
            </div>
            
            <nav class="page-nav">
                <a href="/">Dashboard</a>
                <a href="/calibrate.html" class="active">Servo Calibration</a>
            </nav>
        </header>

        <!-- CALIBRATION CONTENT -->
        <div class="calibration-layout">
            <!-- LEFT: Servo Cards Grid -->
            <div>
                <div class="global-actions">
                    <button class="btn-action primary" onclick="centerAll()">⟲ Center All (90°)</button>
                    <button class="btn-action" onclick="standPose()">🦿 Standing Pose</button>
                    <button class="btn-action danger" onclick="detachAll()">⏻ Detach All</button>
                    <button class="btn-action primary" onclick="saveConfig()">💾 Save to Config</button>
                </div>

                <div class="servo-grid" id="servo-grid">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- RIGHT: Selected Servo Detail -->
            <div class="detail-panel">
                <!-- Robot Map -->
                <div class="detail-card">
                    <h3>Robot Overview</h3>
                    <div class="robot-map">
                        <div class="map-leg" data-leg="FL" onclick="selectLeg('FL')">FL</div>
                        <div class="body-icon">BODY</div>
                        <div class="map-leg" data-leg="FR" onclick="selectLeg('FR')">FR</div>
                        <div class="map-leg" data-leg="HL" onclick="selectLeg('HL')">HL</div>
                        <div class="map-leg" data-leg="HR" onclick="selectLeg('HR')">HR</div>
                    </div>
                </div>

                <!-- Calibration Detail -->
                <div class="detail-card" id="detail-card">
                    <h3>Calibration — <span id="detail-name">Select a servo</span></h3>
                    
                    <div class="detail-field">
                        <label>Tick Min (0°)</label>
                        <input type="number" id="det-tick-min" value="102" min="0" max="4095" onchange="updateServoConfig()">
                    </div>
                    <div class="detail-field">
                        <label>Tick Center (90°)</label>
                        <input type="number" id="det-tick-center" value="307" min="0" max="4095" onchange="updateServoConfig()">
                    </div>
                    <div class="detail-field">
                        <label>Tick Max (180°)</label>
                        <input type="number" id="det-tick-max" value="512" min="0" max="4095" onchange="updateServoConfig()">
                    </div>
                    <div class="detail-field">
                        <label>Trim Offset (°)</label>
                        <input type="number" id="det-trim" value="0" step="0.5" min="-30" max="30" onchange="updateServoConfig()">
                    </div>
                    <div class="detail-field">
                        <label>Limit Min (°)</label>
                        <input type="number" id="det-limit-min" value="0" min="0" max="180" onchange="updateServoConfig()">
                    </div>
                    <div class="detail-field">
                        <label>Limit Max (°)</label>
                        <input type="number" id="det-limit-max" value="180" min="0" max="180" onchange="updateServoConfig()">
                    </div>
                    <div class="toggle-row">
                        <label style="font-size: 0.82rem;">Inverted</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="det-inverted" onchange="updateServoConfig()">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    // ── State ────────────────────────────────────────────────
    let servos = [];
    let selectedIdx = 0;

    // ── API Helpers ──────────────────────────────────────────
    async function api(method, path, body) {
        const opts = { method, headers: { "Content-Type": "application/json" } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        return await res.json();
    }

    function toast(msg, isError = false) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = isError ? "toast error show" : "toast show";
        setTimeout(() => { el.className = "toast"; }, 2500);
    }

    // ── Load servos from server ──────────────────────────────
    async function loadServos() {
        servos = await api("GET", "/api/servos");
        renderServoGrid();
        selectServo(0);
    }

    // ── Render servo cards ───────────────────────────────────
    function renderServoGrid() {
        const grid = document.getElementById("servo-grid");
        grid.innerHTML = "";

        const groups = [
            { label: "Front Legs", cls: "front", range: [0, 6] },
            { label: "Hind Legs", cls: "hind", range: [6, 12] },
        ];

        groups.forEach(g => {
            const lbl = document.createElement("div");
            lbl.className = `leg-group-label ${g.cls}`;
            lbl.textContent = g.label;
            grid.appendChild(lbl);

            for (let i = g.range[0]; i < g.range[1]; i++) {
                grid.appendChild(createServoCard(i, servos[i]));
            }
        });
    }

    function createServoCard(idx, s) {
        const card = document.createElement("div");
        card.className = "servo-card";
        card.id = `servo-card-${idx}`;
        card.onclick = () => selectServo(idx);

        const invLabel = s.inverted ? '<span style="color: var(--accent-orange); font-size:0.7rem;">INV</span>' : '';

        card.innerHTML = `
            <div class="servo-card-header">
                <h3>${s.name} ${invLabel}</h3>
                <span class="servo-idx">IDX ${idx} <span class="servo-channel">CH ${s.channel}</span></span>
            </div>
            <div class="servo-angle-control">
                <input type="range" min="0" max="180" value="90" step="1"
                    id="servo-slider-${idx}"
                    oninput="moveServo(${idx}, this.value)">
                <span class="servo-angle-val" id="servo-val-${idx}">90°</span>
            </div>
            <div class="servo-card-actions">
                <button class="btn-sm" onclick="event.stopPropagation(); moveServo(${idx}, 0)">0°</button>
                <button class="btn-sm" onclick="event.stopPropagation(); moveServo(${idx}, 45)">45°</button>
                <button class="btn-sm" onclick="event.stopPropagation(); moveServo(${idx}, 90)">90°</button>
                <button class="btn-sm" onclick="event.stopPropagation(); moveServo(${idx}, 135)">135°</button>
                <button class="btn-sm" onclick="event.stopPropagation(); moveServo(${idx}, 180)">180°</button>
                <button class="btn-sm" onclick="event.stopPropagation(); sweepServo(${idx})">Sweep</button>
            </div>
        `;
        return card;
    }

    // ── Select a servo ───────────────────────────────────────
    function selectServo(idx) {
        // Deselect previous
        document.querySelectorAll(".servo-card").forEach(c => c.classList.remove("selected"));
        const card = document.getElementById(`servo-card-${idx}`);
        if (card) card.classList.add("selected");

        selectedIdx = idx;
        const s = servos[idx];
        if (!s) return;

        document.getElementById("detail-name").textContent = s.name;
        document.getElementById("det-tick-min").value = s.tick_min;
        document.getElementById("det-tick-center").value = s.tick_center;
        document.getElementById("det-tick-max").value = s.tick_max;
        document.getElementById("det-trim").value = s.trim_deg;
        document.getElementById("det-limit-min").value = s.limit_min_deg;
        document.getElementById("det-limit-max").value = s.limit_max_deg;
        document.getElementById("det-inverted").checked = s.inverted;

        // Highlight corresponding leg on map
        const prefix = s.name.substring(0, 2);
        document.querySelectorAll(".map-leg").forEach(el => {
            el.classList.toggle("active", el.dataset.leg === prefix);
        });
    }

    function selectLeg(legPrefix) {
        // Select first servo of this leg
        const idx = servos.findIndex(s => s.name.startsWith(legPrefix));
        if (idx >= 0) selectServo(idx);
    }

    // ── Move servo via API ───────────────────────────────────
    let moveDebounce = null;
    function moveServo(idx, angleDeg) {
        angleDeg = parseFloat(angleDeg);
        const slider = document.getElementById(`servo-slider-${idx}`);
        const val = document.getElementById(`servo-val-${idx}`);
        if (slider) slider.value = angleDeg;
        if (val) val.textContent = `${Math.round(angleDeg)}°`;

        // Debounce to avoid flooding the server
        clearTimeout(moveDebounce);
        moveDebounce = setTimeout(() => {
            api("POST", "/api/servo/move", { index: idx, angle_deg: angleDeg });
        }, 30);
    }

    async function sweepServo(idx) {
        toast(`Sweeping servo ${idx}...`);
        await api("POST", "/api/servo/sweep", { index: idx });
        toast(`Sweep complete for servo ${idx}`);
    }

    // ── Update calibration config via API ────────────────────
    async function updateServoConfig() {
        const body = {
            index: selectedIdx,
            tick_min: parseInt(document.getElementById("det-tick-min").value),
            tick_center: parseInt(document.getElementById("det-tick-center").value),
            tick_max: parseInt(document.getElementById("det-tick-max").value),
            trim_deg: parseFloat(document.getElementById("det-trim").value),
            limit_min_deg: parseFloat(document.getElementById("det-limit-min").value),
            limit_max_deg: parseFloat(document.getElementById("det-limit-max").value),
            inverted: document.getElementById("det-inverted").checked,
        };

        const res = await api("POST", "/api/servo/update-config", body);
        if (res.servo) {
            servos[selectedIdx] = res.servo;
            toast(`Updated ${res.servo.name}`);
        } else {
            toast(res.error || "Update failed", true);
        }
    }

    // ── Global actions ───────────────────────────────────────
    async function centerAll() {
        await api("POST", "/api/servo/center-all");
        // Reset all sliders to 90
        for (let i = 0; i < 12; i++) {
            const sl = document.getElementById(`servo-slider-${i}`);
            const vl = document.getElementById(`servo-val-${i}`);
            if (sl) sl.value = 90;
            if (vl) vl.textContent = "90°";
        }
        toast("All servos centered at 90°");
    }

    async function standPose() {
        await api("POST", "/api/servo/stand");
        toast("Standing pose applied");
    }

    async function detachAll() {
        await api("POST", "/api/servo/detach-all");
        toast("All servos detached (PWM off)");
    }

    async function saveConfig() {
        const res = await api("POST", "/api/servo/save");
        if (res.ok) {
            toast("✓ Calibration saved to config.json");
        } else {
            toast(res.error || "Save failed", true);
        }
    }

    // ── Init ─────────────────────────────────────────────────
    loadServos();
    </script>
</body>
</html>
